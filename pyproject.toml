[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "archupdater"
version = "1.0.0"
description = "GUI-first desktop updater for Arch-based systems"
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = ["PySide6>=6.11.1,<7", "packaging>=26.2,<27"]

[project.urls]
Homepage = "https://github.com/Darayavaush-84/ArchUpdater"
Repository = "https://github.com/Darayavaush-84/ArchUpdater.git"
Issues = "https://github.com/Darayavaush-84/ArchUpdater/issues"

[project.scripts]
archupdater = "archupdater.app:main"
archupdater-helper = "archupdater.helper.privileged_helper:main"

[project.optional-dependencies]
dev = ["build>=1.5,<2", "ruff>=0.15.22,<1", "vulture>=2.16,<3"]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = false

[tool.setuptools.package-data]
archupdater = [
    "i18n/resources/*.qm",
    "resources/img/logos/*",
    "resources/img/illustrations/*",
    "resources/data/*",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["archupdater*"]
exclude = ["tests*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
